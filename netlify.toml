[build]
  # Static site — no build command needed for HTML/CSS/JS
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "TURNSTILE_SITE_KEY"
  SECRETS_SCAN_OMIT_PATHS = "admin.html"

[functions]
  node_bundler = "esbuild"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Prevent admin page caching
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
    Pragma = "no-cache"

# Prevent function response caching
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# SPA-style redirect for /admin to admin.html
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# SPA-style redirect for event detail pages
[[redirects]]
  from = "/events/*"
  to = "/event-detail.html"
  status = 200

# SPA-style redirect for project detail pages
[[redirects]]
  from = "/project-space/*"
  to = "/project-detail.html"
  status = 200

# Redirect /api/* to Netlify functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
